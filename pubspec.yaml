name: rural_ride
description: A ride-hailing app for rural Africa - simple, offline-friendly, and accessible.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Navigation
  go_router: ^12.1.1

  # Local Storage & Offline
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.1

  # Network
  dio: ^5.3.2
  connectivity_plus: ^5.0.2
  internet_connection_checker: ^1.0.0+1

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1
  flutter_polyline_points: ^2.0.0

  # Media & UI
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9

  # Text to Speech
  flutter_tts: ^3.8.3

  # Phone Authentication
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  cloud_firestore: ^4.13.6
  firebase_storage: ^11.5.6

  # Phone number input
  intl_phone_field: ^3.2.0
  intl: ^0.18.1

  # Permissions
  permission_handler: ^11.1.0

  # Functional Programming
  dartz: ^0.10.1

  # UI utilities
  flutter_spinkit: ^5.2.0
  pin_code_fields: ^8.0.1
  smooth_page_indicator: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  bloc_test: ^9.1.5
  mocktail: ^1.0.1

dependency_overrides:
  # This forces a modern version of analyzer that satisfies flutter_test/bloc_test,
  # while allowing hive_generator to still compile successfully.
  analyzer: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/images/
    - assets/icons/
    - assets/lottie/